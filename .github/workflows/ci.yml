name: Rust CI

# No workflow-wide permissions: each job declares the minimum it needs, so a
# compromised third-party action cannot escalate beyond its own job.
on:
  push:
    branches: [ master ]
    tags: [ 'v*' ]
    # Docs, the GitHub Pages site, screenshots, and icon assets cannot break
    # the Rust code, so skip them. Tag pushes are not evaluated against path
    # filters, so releases always run the full pipeline (assets/ is a build
    # input via cargo:rerun-if-changed and is covered there).
    paths-ignore:
      - '**/*.md'
      - 'images/**'
      - 'docs/**'
      - 'assets/**'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'images/**'
      - 'docs/**'
      - 'assets/**'

jobs:
  build-and-test:
    permissions:
      contents: read
      actions: write # upload-artifact
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # pinned action
        with:
          # Keep in sync with rust-toolchain.toml. Pinned: stable 1.100 added
          # clippy::needless_bool and turned CI red without a code change.
          # Bump deliberately, not implicitly.
          toolchain: 1.100.0

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Build debug binary
        run: cargo build --locked --verbose

      - name: Test
        run: cargo test --locked --verbose

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Audit dependencies
        # Pinned deliberately: unpinned installs drift with upstream and can
        # break the pipeline (or worse) without a local change. Bump by hand.
        run: |
          cargo install cargo-audit --version 0.22.2 --locked
          cargo audit

      - name: Build release binary
        run: cargo build --locked --release --verbose

      - name: Upload release EXE artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: framework-crate-windows-release
          path: target/release/framework-crate.exe

  msrv:
    permissions:
      contents: read
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install MSRV toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # pinned action
        with:
          # Overrides rust-toolchain.toml on purpose: this job verifies the
          # MSRV from Cargo.toml, while normal builds use the pinned channel.
          toolchain: 1.99.1

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Check MSRV
        # `+1.99.1` overrides rust-toolchain.toml; without it cargo would use
        # the pinned build channel and this job would not test the MSRV.
        run: cargo +1.99.1 check --locked --all-targets

  release:
    needs: [build-and-test, msrv]
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
      actions: read # download-artifact
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Download release EXE artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: framework-crate-windows-release
          path: dist

      - name: Install Inno Setup
        shell: pwsh
        # Pinned deliberately, like the Rust toolchain. 6.7.1 is the current
        # Chocolatey package and supports ArchitecturesInstallIn64BitMode=
        # x64compatible.
        run: choco install innosetup --version=6.7.1 -y --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          # The release EXE was built in a previous job, so stage it where the
          # generated .iss [Files] section expects it.
          New-Item -ItemType Directory -Path target\release -Force | Out-Null
          Copy-Item dist\framework-crate.exe target\release\framework-crate.exe -Force

          $cargo = Get-Content Cargo.toml -Raw
          $match = [regex]::Match($cargo, '(?m)^version\s*=\s*"([^"]+)"')
          if (-not $match.Success) { throw "cannot read Cargo version" }
          $version = $match.Groups[1].Value

          # Keep the installer source in the workflow: the installer/ folder is
          # local-only and is not checked out by CI.
          $iss = @'
          ; Generated by .github/workflows/ci.yml. Do not commit.
          #ifndef MyAppVersion
            #define MyAppVersion "0.0.0"
          #endif

          #define MyAppName "Framework Crate"
          #define MyAppPublisher "Framework Crate"
          #define MyAppURL "https://github.com/vinctw22/Framework-Crate"
          #define MyAppExeName "framework-crate.exe"

          [Setup]
          AppId={{C7165D6D-ADB1-4252-8A0C-67732FBAB266}
          AppName={#MyAppName}
          AppVersion={#MyAppVersion}
          AppVerName={#MyAppName} {#MyAppVersion}
          AppPublisher={#MyAppPublisher}
          AppPublisherURL={#MyAppURL}
          AppSupportURL={#MyAppURL}/issues
          AppUpdatesURL={#MyAppURL}/releases
          DefaultDirName={autopf}\Framework Crate
          DefaultGroupName={#MyAppName}
          DisableProgramGroupPage=yes
          PrivilegesRequired=admin
          ArchitecturesAllowed=x64compatible
          ArchitecturesInstallIn64BitMode=x64compatible
          MinVersion=10.0
          OutputDir=dist
          OutputBaseFilename=FrameworkCrate-Setup-{#MyAppVersion}
          Compression=lzma2
          SolidCompression=yes
          WizardStyle=modern
          SetupLogging=yes
          SetupIconFile=assets\app.ico
          UninstallDisplayName={#MyAppName}
          UninstallDisplayIcon={app}\{#MyAppExeName}
          Uninstallable=yes
          AppMutex=Local\FrameworkCrateSingleInstance
          CloseApplications=no
          RestartApplications=no
          VersionInfoVersion={#MyAppVersion}.0
          VersionInfoProductName={#MyAppName}
          VersionInfoProductVersion={#MyAppVersion}
          VersionInfoCompany={#MyAppPublisher}
          VersionInfoDescription={#MyAppName} installer
          LicenseFile=LICENSE

          [Tasks]
          Name: "desktopicon"; Description: "{cm:CreateDesktopIcon}"; GroupDescription: "{cm:AdditionalIcons}"; Flags: unchecked

          [Files]
          Source: "target\release\framework-crate.exe"; DestDir: "{app}"; Flags: ignoreversion
          Source: "LICENSE"; DestDir: "{app}"; Flags: ignoreversion

          [Icons]
          Name: "{group}\{#MyAppName}"; Filename: "{app}\{#MyAppExeName}"; WorkingDir: "{app}"
          Name: "{group}\Uninstall {#MyAppName}"; Filename: "{uninstallexe}"
          Name: "{autodesktop}\{#MyAppName}"; Filename: "{app}\{#MyAppExeName}"; WorkingDir: "{app}"; Tasks: desktopicon

          [Run]
          Filename: "{app}\{#MyAppExeName}"; WorkingDir: "{app}"; Description: "{cm:LaunchProgram,{#StringChange(MyAppName, '&', '&&')}}"; Flags: nowait postinstall skipifsilent runascurrentuser

          [UninstallRun]
          Filename: "{sys}\schtasks.exe"; Parameters: "/Delete /TN ""FrameworkCrateHandover"" /F"; Flags: runhidden; RunOnceId: "DelHandoverTask"
          Filename: "{sys}\schtasks.exe"; Parameters: "/Delete /TN ""FrameworkCrate"" /F"; Flags: runhidden; RunOnceId: "DelStartupTask"

          [UninstallDelete]
          Type: filesandordirs; Name: "{commonappdata}\framework-crate"
          Type: filesandordirs; Name: "{commonappdata}\FrameworkCrate"

          [Languages]
          Name: "english"; MessagesFile: "compiler:Default.isl"
          '@
          Set-Content -Path framework-crate.iss -Value $iss -Encoding utf8

          $iscc = Get-Command ISCC.exe -ErrorAction SilentlyContinue |
            Select-Object -First 1 -ExpandProperty Source
          if (-not $iscc) {
            $iscc = @(
              "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
              "$env:ProgramFiles\Inno Setup 6\ISCC.exe",
              "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe",
              "$env:LOCALAPPDATA\Inno Setup 6\ISCC.exe"
            ) | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          }
          if (-not $iscc) { throw "ISCC.exe not found; Inno Setup install failed" }

          & $iscc "/DMyAppVersion=$version" framework-crate.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE" }

          $setup = "dist\FrameworkCrate-Setup-$version.exe"
          if (-not (Test-Path -LiteralPath $setup)) {
            throw "installer output missing: $setup"
          }
          Get-FileHash -LiteralPath $setup -Algorithm SHA256

      - name: Generate winget manifest
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist\FrameworkCrate-Setup-*.exe |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if (-not $setup) { throw "installer output missing" }
          $setupHash = (Get-FileHash $setup.FullName -Algorithm SHA256).Hash

          $cargo = Get-Content Cargo.toml -Raw
          $match = [regex]::Match($cargo, '(?m)^version\s*=\s*"([^"]+)"')
          if (-not $match.Success) { throw "cannot read Cargo version" }
          $version = $match.Groups[1].Value

          $tag = $env:GITHUB_REF_NAME
          if ("v$version" -ne $tag) {
            throw "Cargo.toml version $version does not match release tag $tag"
          }
          $assetUrl = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$tag/$($setup.Name)"
          $releaseUrl = "https://github.com/$env:GITHUB_REPOSITORY/releases/tag/$tag"

          $manifest = @'
          # yaml-language-server: $schema=https://aka.ms/winget-manifest.singleton.1.10.0.schema.json
          PackageIdentifier: FrameworkCrate.FrameworkCrate
          PackageVersion: __VERSION__
          PackageLocale: en-US
          Publisher: Framework Crate
          PublisherUrl: https://github.com/vinctw22/Framework-Crate
          PublisherSupportUrl: https://github.com/vinctw22/Framework-Crate/issues
          PackageName: Framework Crate
          PackageUrl: https://github.com/vinctw22/Framework-Crate
          License: MIT
          LicenseUrl: https://github.com/vinctw22/Framework-Crate/blob/master/LICENSE
          Copyright: Copyright (c) Vincent Chang
          ShortDescription: Framework laptop fan control and telemetry GUI
          Description: >-
            Framework Crate is a Windows tray application for Framework laptops. It
            controls fan curves and manual duty, charge limit, keyboard backlight,
            privacy switches, PD port classification, and Intel/AMD CPU power limits,
            with a live temperature chart.
          Moniker: framework-crate
          Tags:
            - fan-control
            - framework
            - laptop
            - telemetry
          ReleaseNotesUrl: __RELEASE_URL__
          ManifestType: singleton
          ManifestVersion: 1.10.0
          Installers:
            - Architecture: x64
              InstallerType: inno
              Scope: machine
              InstallModes:
                - interactive
                - silent
                - silentWithProgress
              UpgradeBehavior: install
              ProductCode: "{C7165D6D-ADB1-4252-8A0C-67732FBAB266}_is1"
              ElevationRequirement: elevatesSelf
              InstallerUrl: __ASSET_URL__
              InstallerSha256: __SHA256__
              InstallerSwitches:
                Silent: /VERYSILENT /SUPPRESSMSGBOXES /NORESTART /SP-
                SilentWithProgress: /SILENT /SUPPRESSMSGBOXES /NORESTART /SP-
              AppsAndFeaturesEntries:
                - DisplayName: Framework Crate
                  Publisher: Framework Crate
                  DisplayVersion: __VERSION__
                  ProductCode: "{C7165D6D-ADB1-4252-8A0C-67732FBAB266}_is1"
          '@
          $manifest = $manifest.Replace('__VERSION__', $version)
          $manifest = $manifest.Replace('__ASSET_URL__', $assetUrl)
          $manifest = $manifest.Replace('__SHA256__', $setupHash)
          $manifest = $manifest.Replace('__RELEASE_URL__', $releaseUrl)
          Set-Content -Path dist\FrameworkCrate.FrameworkCrate.yaml -Value $manifest -Encoding utf8
          Get-Content dist\FrameworkCrate.FrameworkCrate.yaml

      - name: Validate winget manifest
        shell: pwsh
        run: |
          winget --version
          winget validate --manifest dist\FrameworkCrate.FrameworkCrate.yaml

      - name: Checksums
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist\framework-crate.exe -Algorithm SHA256).Hash
          "$hash  framework-crate.exe" | Out-File -Encoding ascii SHA256SUMS
          $setup = Get-ChildItem dist\FrameworkCrate-Setup-*.exe |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if (-not $setup) { throw "installer output missing" }
          $setupHash = (Get-FileHash $setup.FullName -Algorithm SHA256).Hash
          "$setupHash  $($setup.Name)" | Out-File -Append -Encoding ascii SHA256SUMS
          Get-Content SHA256SUMS

      - name: Install git-cliff
        shell: pwsh
        run: |
          $ver = "2.13.1"
          $url = "https://github.com/orhun/git-cliff/releases/download/v${ver}/git-cliff-${ver}-x86_64-pc-windows-msvc.zip"
          Invoke-WebRequest $url -OutFile gitcliff.zip
          # No upstream checksum file ships for the Windows zip, so the hash
          # below is trust-on-first-use (pinned 2026-10-05). It still catches
          # any later replacement of the asset. Update it when bumping $ver.
          $hash = (Get-FileHash gitcliff.zip -Algorithm SHA256).Hash
          if ($hash -ne "3AE3A5549E85C7AD5B20192EBCFEE4371269DECA51255F6F2F2E051C6541F5CA") { throw "git-cliff checksum mismatch: $hash" }
          Expand-Archive gitcliff.zip -DestinationPath gitcliff
          $exe = Get-ChildItem -Recurse -Filter git-cliff.exe gitcliff | Select-Object -First 1
          Write-Output "git-cliff installed at $($exe.DirectoryName)"

      - name: Generate changelog
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Recurse -Filter git-cliff.exe gitcliff | Select-Object -First 1
          & $exe.FullName --config cliff.toml --latest --strip header --output release_notes.md
          # git-cliff separates every bullet with a blank line; collapse those
          # so the published notes read as compact lists (one blank line
          # between groups).
          $notes = Get-Content release_notes.md -Raw
          $notes = $notes -replace "(?m)^\r?\n(?=- )", ""
          $notes = $notes -replace "(\r?\n){3,}", "`n`n"
          Set-Content -Path release_notes.md -Value $notes -NoNewline -Encoding utf8
          Get-Content release_notes.md

      - name: Append contributors
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          $prev = git describe --tags --abbrev=0 "$tag^" 2>$null
          if ($prev) { $range = "${prev}...${tag}" } else { $range = $tag }
          $owner = $env:GITHUB_REPOSITORY_OWNER
          $logins = gh api "repos/$env:GITHUB_REPOSITORY/compare/$range" --jq '.commits[].author.login' 2>$null
          $contribs = $logins |
            Where-Object { $_ -and $_ -ne "github-actions[bot]" -and $_ -ne $owner } |
            Sort-Object -Unique
          if ($contribs) {
            $line = "`n**Contributors**: " + (($contribs | ForEach-Object { "@$_" }) -join ", ")
            Add-Content -Path release_notes.md -Value $line -Encoding utf8
          }

      - name: VirusTotal scan
        # Uploads the release binary and installer, waits for the multi-engine
        # scans, and adds one report link per artifact to the release notes.
        # Never blocks a release (continue-on-error + bounded waits), and the
        # key is only exposed to this tag-gated job (repository secret). Once a
        # signing step exists it must run BEFORE the checksums step so these
        # hashes match the signed binaries.
        continue-on-error: true
        shell: pwsh
        env:
          VT_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
        run: |
          if (-not $env:VT_API_KEY) {
            Write-Output "VIRUSTOTAL_API_KEY not configured; skipping upload."
            exit 0
          }
          $setup = Get-ChildItem dist\FrameworkCrate-Setup-*.exe |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          $files = @(
            [pscustomobject]@{ Path = "dist\framework-crate.exe"; Label = "framework-crate.exe" }
          )
          if ($setup) {
            $files += [pscustomobject]@{ Path = $setup.FullName; Label = $setup.Name }
          } else {
            Write-Output "installer output missing; scanning the EXE only."
          }

          function Get-VtJson([string]$url, [string]$method, [string]$path = "") {
            if ($method -eq "POST") {
              $raw = curl.exe -sS -X POST --form "file=@$path" --header "x-apikey: $env:VT_API_KEY" $url
            } else {
              $raw = curl.exe -sS --header "x-apikey: $env:VT_API_KEY" $url
            }
            if ($LASTEXITCODE -ne 0 -or -not $raw) { return $null }
            try { return ($raw | ConvertFrom-Json) } catch { return $null }
          }

          $lines = @()
          foreach ($file in $files) {
            $hash = (Get-FileHash -LiteralPath $file.Path -Algorithm SHA256).Hash.ToLower()
            $link = "https://www.virustotal.com/gui/file/$hash"
            $upload = Get-VtJson "https://www.virustotal.com/api/v3/files" "POST" $file.Path
            if (-not $upload) {
              Write-Output "VirusTotal upload failed for $($file.Label); no report link."
              $lines += "- **$($file.Label)**: upload unavailable"
              continue
            }
            $analysisId = $upload.data.id
            $status = $upload.data.attributes.status
            $analysis = $upload
            # Free API allows 4 requests/minute: poll every 30s, up to 12 min.
            for ($i = 0; $i -lt 24 -and $status -ne "completed"; $i++) {
              Start-Sleep -Seconds 30
              $analysis = Get-VtJson "https://www.virustotal.com/api/v3/analyses/$analysisId" "GET"
              if (-not $analysis) { break }
              $status = $analysis.data.attributes.status
              Write-Output "VirusTotal analysis status ($($file.Label)): $status"
            }
            $verdict = ""
            if ($analysis -and $analysis.data.attributes.stats) {
              $s = $analysis.data.attributes.stats
              $total = ($s.harmless + $s.malicious + $s.suspicious + $s.undetected + $s.timeout)
              $verdict = "`n  - $($s.malicious) malicious, $($s.suspicious) suspicious of $total engines"
            }
            if ($status -ne "completed") {
              Write-Output "VirusTotal analysis for $($file.Label) did not complete in time; publishing the link anyway."
            }
            $lines += "- **$($file.Label)**: $link$verdict"
          }
          Add-Content -Path release_notes.md -Value "`n### Verification`n$($lines -join "`n")" -Encoding utf8

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          files: |
            dist/framework-crate.exe
            dist/FrameworkCrate-Setup-*.exe
            dist/FrameworkCrate.FrameworkCrate.yaml
            SHA256SUMS
          body_path: release_notes.md
          generate_release_notes: false
          make_latest: true
